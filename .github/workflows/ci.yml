name: CI Pipeline

on:
  push:
    branches:
      - test-workflow
  pull_request:
    branches:
      - test-workflow

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    steps:
      # Setup
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install yarn globally
        run: npm i -g yarn

      # Client
      - name: Install client dependencies
        working-directory: ./client
        run: yarn

      - name: Build client
        working-directory: ./client
        run: yarn build

      # Server
      - name: Install server dependencies
        working-directory: ./server
        run: yarn

      - name: Build server
        working-directory: ./server
        run: yarn build
